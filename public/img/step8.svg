<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" fill="none" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s8-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="s8-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6007A"/>
      <stop offset="100%" stop-color="#6745D2"/>
    </linearGradient>
    <linearGradient id="s8-chart" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6007A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E6007A" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <path d="M120,80 C240,60 380,60 490,120 C560,160 590,300 540,400 C490,500 340,540 220,520 C120,505 60,420 60,300 C60,220 40,110 120,80 Z" fill="url(#s8-grad)" opacity="0.85"/>
  <circle cx="500" cy="580" r="90" fill="#6745D2" opacity="0.4"/>

  <!-- Staking Rewards page -->
  <g transform="translate(50 120) rotate(-2)" filter="url(#s8-shadow)">
    <rect x="0" y="0" width="500" height="440" rx="16" fill="#0D0D10"/>
    <rect x="0" y="0" width="500" height="52" rx="16" fill="#1C1C26"/>
    <rect x="0" y="36" width="500" height="16" fill="#1C1C26"/>
    <text x="24" y="32" font-size="15" font-weight="700" fill="#fff">Staking Rewards</text>
    <text x="24" y="46" font-size="10" fill="#8A94A6">Realized APR · Full history</text>
    <rect x="360" y="14" width="60" height="24" rx="12" fill="#1C1C26"/>
    <text x="390" y="30" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">CSV</text>
    <rect x="426" y="14" width="60" height="24" rx="12" fill="#E6007A"/>
    <text x="456" y="30" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Export</text>

    <!-- KPI row -->
    <rect x="24" y="70" width="145" height="70" rx="12" fill="#131319"/>
    <text x="38" y="90" font-size="10" font-weight="600" fill="#8A94A6">TOTAL EARNED</text>
    <text x="38" y="118" font-size="20" font-weight="700" fill="#E6007A">124.8</text>
    <text x="118" y="118" font-size="11" fill="#8A94A6">PDEX</text>
    <text x="38" y="134" font-size="10" fill="#1BC29A">since Era 812</text>

    <rect x="177" y="70" width="145" height="70" rx="12" fill="#131319"/>
    <text x="191" y="90" font-size="10" font-weight="600" fill="#8A94A6">REALIZED APR</text>
    <text x="191" y="118" font-size="20" font-weight="700" fill="#fff">13.42%</text>
    <text x="191" y="134" font-size="10" fill="#8A94A6">Trailing 90d</text>

    <rect x="330" y="70" width="145" height="70" rx="12" fill="#131319"/>
    <text x="344" y="90" font-size="10" font-weight="600" fill="#8A94A6">BEST VALIDATOR</text>
    <text x="344" y="118" font-size="14" font-weight="700" fill="#fff">PAVAN</text>
    <text x="344" y="134" font-size="10" fill="#1BC29A">14.20% APR</text>

    <!-- Chart area -->
    <rect x="24" y="156" width="452" height="200" rx="12" fill="#131319"/>
    <text x="40" y="180" font-size="12" font-weight="700" fill="#fff">Rewards per era</text>
    <text x="40" y="196" font-size="10" fill="#8A94A6">PDEX</text>

    <!-- Chart bars/area -->
    <g transform="translate(40 216)">
      <!-- Grid lines -->
      <line x1="0" y1="0" x2="420" y2="0" stroke="#2A2A38" stroke-dasharray="2 4"/>
      <line x1="0" y1="40" x2="420" y2="40" stroke="#2A2A38" stroke-dasharray="2 4"/>
      <line x1="0" y1="80" x2="420" y2="80" stroke="#2A2A38" stroke-dasharray="2 4"/>
      <line x1="0" y1="120" x2="420" y2="120" stroke="#2A2A38"/>
      <!-- Area fill -->
      <path d="M0,90 L30,80 L60,72 L90,64 L120,58 L150,52 L180,46 L210,44 L240,38 L270,42 L300,32 L330,28 L360,22 L390,20 L420,14 L420,120 L0,120 Z" fill="url(#s8-chart)"/>
      <!-- Line -->
      <polyline points="0,90 30,80 60,72 90,64 120,58 150,52 180,46 210,44 240,38 270,42 300,32 330,28 360,22 390,20 420,14" stroke="#E6007A" stroke-width="2" fill="none"/>
      <!-- Dots -->
      <g fill="#E6007A">
        <circle cx="0" cy="90" r="3"/>
        <circle cx="60" cy="72" r="3"/>
        <circle cx="120" cy="58" r="3"/>
        <circle cx="180" cy="46" r="3"/>
        <circle cx="240" cy="38" r="3"/>
        <circle cx="300" cy="32" r="3"/>
        <circle cx="360" cy="22" r="3"/>
        <circle cx="420" cy="14" r="3" stroke="#fff" stroke-width="2"/>
      </g>
    </g>

    <!-- X labels -->
    <g font-size="9" fill="#8A94A6">
      <text x="40" y="352">1420</text>
      <text x="150" y="352">1424</text>
      <text x="260" y="352">1428</text>
      <text x="370" y="352">1432</text>
      <text x="440" y="352">Era</text>
    </g>

    <!-- Footer / unstake -->
    <rect x="24" y="376" width="452" height="42" rx="10" fill="#131319"/>
    <text x="40" y="401" font-size="11" fill="#8A94A6">Need to unstake? Unbonding takes 28 days.</text>
    <rect x="376" y="386" width="88" height="22" rx="11" fill="#1C1C26" stroke="#8A94A6"/>
    <text x="420" y="401" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">Unstake</text>
  </g>

  <g>
    <circle cx="475" cy="180" r="16" fill="#E6007A"/>
    <text x="475" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  </g>
  <g>
    <circle cx="510" cy="380" r="16" fill="#E6007A"/>
    <text x="510" y="386" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  </g>
</svg>
