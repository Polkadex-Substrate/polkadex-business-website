<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" fill="none" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s3-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="s3-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6007A"/>
      <stop offset="100%" stop-color="#6745D2"/>
    </linearGradient>
  </defs>

  <circle cx="480" cy="140" r="150" fill="url(#s3-grad)" opacity="0.9"/>
  <circle cx="100" cy="520" r="120" fill="#E6007A" opacity="0.35"/>

  <!-- BuyPDEX swap card -->
  <g transform="translate(90 130) rotate(-3)" filter="url(#s3-shadow)">
    <rect x="0" y="0" width="420" height="440" rx="20" fill="#ffffff"/>

    <!-- Header -->
    <text x="30" y="52" font-size="20" font-weight="700" fill="#1C1C26">BuyPDEX.com</text>
    <rect x="164" y="34" width="72" height="22" rx="11" fill="#F1F3F6"/>
    <text x="200" y="49" text-anchor="middle" font-size="11" font-weight="600" fill="#6745D2">Direct swap</text>
    <rect x="330" y="30" width="70" height="30" rx="15" fill="#E6007A"/>
    <text x="365" y="49" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">Connect</text>

    <text x="30" y="86" font-size="12" fill="#8A94A6">Get native PDEX in one step — no CEX account required.</text>

    <!-- From box -->
    <rect x="30" y="108" width="360" height="90" rx="14" fill="#F7F8FB"/>
    <text x="46" y="130" font-size="11" font-weight="600" fill="#8A94A6">YOU PAY</text>
    <text x="46" y="172" font-size="28" font-weight="700" fill="#1C1C26">500.00</text>
    <rect x="290" y="146" width="86" height="34" rx="17" fill="#ffffff" stroke="#E4E7EC"/>
    <circle cx="308" cy="163" r="10" fill="#627EEA"/>
    <text x="308" y="167" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Ξ</text>
    <text x="330" y="167" font-size="12" font-weight="600" fill="#1C1C26">USDC</text>
    <text x="368" y="167" font-size="10" fill="#8A94A6">▾</text>
    <text x="46" y="192" font-size="10" fill="#8A94A6">Balance: 812.40</text>

    <!-- Swap arrow -->
    <circle cx="210" cy="208" r="18" fill="#ffffff" stroke="#E4E7EC" stroke-width="2"/>
    <path d="M210 200 v14 M204 208 l6 6 l6 -6" stroke="#E6007A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- To box -->
    <rect x="30" y="220" width="360" height="90" rx="14" fill="#FFF0F7"/>
    <text x="46" y="242" font-size="11" font-weight="600" fill="#8A94A6">YOU RECEIVE</text>
    <text x="46" y="284" font-size="28" font-weight="700" fill="#E6007A">246.13</text>
    <rect x="290" y="258" width="86" height="34" rx="17" fill="#ffffff" stroke="#E4E7EC"/>
    <circle cx="308" cy="275" r="10" fill="#E6007A"/>
    <text x="308" y="279" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">P</text>
    <text x="330" y="279" font-size="12" font-weight="600" fill="#1C1C26">PDEX</text>
    <text x="46" y="304" font-size="10" fill="#8A94A6">1 USDC ≈ 0.4923 PDEX</text>

    <!-- Rate row -->
    <rect x="30" y="322" width="360" height="34" rx="10" fill="#F7F8FB"/>
    <text x="46" y="343" font-size="11" fill="#8A94A6">Est. network fee</text>
    <text x="374" y="343" text-anchor="end" font-size="11" font-weight="600" fill="#1C1C26">~ $2.10</text>

    <!-- CTA -->
    <rect x="30" y="374" width="360" height="46" rx="12" fill="#E6007A"/>
    <text x="210" y="402" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Swap to PDEX</text>
  </g>

  <g>
    <circle cx="500" cy="200" r="16" fill="#E6007A"/>
    <text x="500" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  </g>
  <g>
    <circle cx="475" cy="555" r="16" fill="#E6007A"/>
    <text x="475" y="561" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  </g>
</svg>
