<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" fill="none" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s7-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="s7-grad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6007A"/>
      <stop offset="100%" stop-color="#6745D2"/>
    </linearGradient>
  </defs>

  <circle cx="510" cy="120" r="140" fill="url(#s7-grad)" opacity="0.85"/>
  <circle cx="80" cy="530" r="110" fill="#E6007A" opacity="0.4"/>

  <!-- Pay out rewards modal -->
  <g transform="translate(70 120) rotate(2)" filter="url(#s7-shadow)">
    <rect x="0" y="0" width="480" height="440" rx="16" fill="#0D0D10"/>
    <rect x="0" y="0" width="480" height="56" rx="16" fill="#1C1C26"/>
    <rect x="0" y="40" width="480" height="16" fill="#1C1C26"/>
    <text x="24" y="34" font-size="15" font-weight="700" fill="#fff">Pay out rewards</text>
    <text x="24" y="50" font-size="11" fill="#8A94A6">28 unclaimed payouts across 3 validators</text>
    <text x="454" y="34" text-anchor="middle" font-size="18" fill="#8A94A6">×</text>

    <!-- Summary bar -->
    <rect x="24" y="76" width="432" height="70" rx="12" fill="#131319"/>
    <text x="40" y="100" font-size="10" font-weight="600" fill="#8A94A6">UNCLAIMED</text>
    <text x="40" y="128" font-size="22" font-weight="700" fill="#E6007A">18.42</text>
    <text x="118" y="128" font-size="12" fill="#8A94A6">PDEX</text>
    <rect x="308" y="94" width="140" height="36" rx="10" fill="#E6007A"/>
    <text x="378" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">Claim all</text>

    <!-- Payout list header -->
    <text x="24" y="172" font-size="10" font-weight="700" fill="#8A94A6">VALIDATOR</text>
    <text x="230" y="172" font-size="10" font-weight="700" fill="#8A94A6">ERA</text>
    <text x="300" y="172" font-size="10" font-weight="700" fill="#8A94A6">AMOUNT</text>
    <text x="400" y="172" font-size="10" font-weight="700" fill="#8A94A6">EXPIRES</text>

    <g font-size="12" fill="#fff">
      <!-- row 1 -->
      <rect x="0" y="184" width="480" height="42" fill="#0D0D10"/>
      <circle cx="38" cy="205" r="9" fill="#1BC29A"/>
      <text x="56" y="209" font-weight="600">PAVAN | POLKADEX</text>
      <text x="230" y="209" font-size="11">1428</text>
      <text x="300" y="209" font-weight="600" fill="#E6007A">2.14</text>
      <text x="400" y="209" font-size="11" fill="#8A94A6">in 42 eras</text>

      <rect x="0" y="226" width="480" height="42" fill="#131319"/>
      <circle cx="38" cy="247" r="9" fill="#6745D2"/>
      <text x="56" y="251" font-weight="600">CRIFFERENT.DE</text>
      <text x="230" y="251" font-size="11">1428</text>
      <text x="300" y="251" font-weight="600" fill="#E6007A">1.87</text>
      <text x="400" y="251" font-size="11" fill="#8A94A6">in 42 eras</text>

      <rect x="0" y="268" width="480" height="42" fill="#0D0D10"/>
      <circle cx="38" cy="289" r="9" fill="#FF7A45"/>
      <text x="56" y="293" font-weight="600">HODL</text>
      <text x="230" y="293" font-size="11">1428</text>
      <text x="300" y="293" font-weight="600" fill="#E6007A">1.42</text>
      <text x="400" y="293" font-size="11" fill="#8A94A6">in 42 eras</text>

      <rect x="0" y="310" width="480" height="42" fill="#131319"/>
      <circle cx="38" cy="331" r="9" fill="#1BC29A"/>
      <text x="56" y="335" font-weight="600">PAVAN | POLKADEX</text>
      <text x="230" y="335" font-size="11">1427</text>
      <text x="300" y="335" font-weight="600" fill="#E6007A">2.11</text>
      <text x="400" y="335" font-size="11" fill="#FFA500">in 8 eras</text>

      <rect x="0" y="352" width="480" height="42" fill="#0D0D10"/>
      <text x="56" y="377" font-size="11" fill="#8A94A6">+ 24 more payouts…</text>
    </g>

    <!-- Info bar -->
    <rect x="24" y="404" width="432" height="24" rx="6" fill="#3A2418"/>
    <text x="36" y="420" font-size="10" fill="#FFA500">Unclaimed rewards expire after ~84 eras. Claim regularly.</text>
  </g>

  <g>
    <circle cx="510" cy="230" r="16" fill="#E6007A"/>
    <text x="510" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  </g>
  <g>
    <circle cx="150" cy="245" r="16" fill="#E6007A"/>
    <text x="150" y="251" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  </g>
</svg>
