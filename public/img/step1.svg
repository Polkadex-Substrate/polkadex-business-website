<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" fill="none" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="s1-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6007A"/>
      <stop offset="100%" stop-color="#6745D2"/>
    </linearGradient>
  </defs>

  <!-- Background blob -->
  <path d="M540,120 C580,180 590,300 540,400 C490,500 380,540 300,520 C220,500 170,420 200,340 C230,260 200,180 260,120 C320,60 500,60 540,120 Z" fill="url(#s1-grad)" opacity="0.85"/>
  <circle cx="120" cy="540" r="90" fill="#6745D2" opacity="0.35"/>

  <!-- Browser window (tilted) -->
  <g transform="translate(60 130) rotate(-3)" filter="url(#s1-shadow)">
    <rect x="0" y="0" width="480" height="360" rx="14" fill="#ffffff"/>
    <!-- Chrome bar -->
    <rect x="0" y="0" width="480" height="44" rx="14" fill="#F1F3F6"/>
    <rect x="0" y="30" width="480" height="14" fill="#F1F3F6"/>
    <circle cx="20" cy="22" r="6" fill="#FF5F57"/>
    <circle cx="40" cy="22" r="6" fill="#FEBC2E"/>
    <circle cx="60" cy="22" r="6" fill="#28C840"/>
    <!-- Address bar -->
    <rect x="90" y="12" width="260" height="20" rx="10" fill="#ffffff" stroke="#E4E7EC"/>
    <text x="102" y="26" font-size="11" fill="#8A94A6">polkadot.js.org/extension</text>
    <!-- Extension icons in toolbar -->
    <rect x="360" y="10" width="24" height="24" rx="6" fill="#F1F3F6"/>
    <rect x="390" y="10" width="24" height="24" rx="6" fill="#F1F3F6"/>
    <circle cx="432" cy="22" r="12" fill="#E6007A"/>
    <text x="432" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">P</text>

    <!-- Wallet popup -->
    <rect x="280" y="60" width="180" height="270" rx="12" fill="#1C1C26"/>
    <rect x="280" y="60" width="180" height="42" rx="12" fill="#2A2A38"/>
    <rect x="280" y="90" width="180" height="12" fill="#2A2A38"/>
    <circle cx="298" cy="81" r="8" fill="#E6007A"/>
    <text x="314" y="85" font-size="11" font-weight="600" fill="#fff">Add Account</text>

    <!-- Popup body -->
    <circle cx="370" cy="180" r="42" fill="#2A2A38"/>
    <path d="M356 180 h28 M370 166 v28" stroke="#8A94A6" stroke-width="3" stroke-linecap="round"/>
    <text x="370" y="252" text-anchor="middle" font-size="10" fill="#8A94A6">You don&apos;t have</text>
    <text x="370" y="266" text-anchor="middle" font-size="10" fill="#8A94A6">any accounts yet</text>
    <rect x="298" y="290" width="144" height="26" rx="13" fill="#E6007A"/>
    <text x="370" y="307" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Create new account</text>

    <!-- Site body content -->
    <text x="30" y="80" font-size="18" font-weight="700" fill="#1C1C26">Wallet extensions for Polkadex</text>
    <rect x="30" y="102" width="220" height="8" rx="4" fill="#E4E7EC"/>
    <rect x="30" y="118" width="180" height="8" rx="4" fill="#E4E7EC"/>

    <rect x="30" y="150" width="110" height="80" rx="10" fill="#F1F3F6"/>
    <circle cx="60" cy="180" r="14" fill="#E6007A"/>
    <text x="85" y="184" font-size="12" font-weight="600" fill="#1C1C26">Polkadot.js</text>
    <rect x="42" y="200" width="86" height="6" rx="3" fill="#D3D8E0"/>
    <rect x="42" y="212" width="60" height="6" rx="3" fill="#D3D8E0"/>

    <rect x="150" y="150" width="110" height="80" rx="10" fill="#F1F3F6"/>
    <circle cx="180" cy="180" r="14" fill="#6745D2"/>
    <text x="205" y="184" font-size="12" font-weight="600" fill="#1C1C26">Talisman</text>
    <rect x="162" y="200" width="86" height="6" rx="3" fill="#D3D8E0"/>
    <rect x="162" y="212" width="70" height="6" rx="3" fill="#D3D8E0"/>

    <rect x="30" y="240" width="110" height="80" rx="10" fill="#F1F3F6"/>
    <circle cx="60" cy="270" r="14" fill="#1BC29A"/>
    <text x="85" y="274" font-size="12" font-weight="600" fill="#1C1C26">SubWallet</text>
    <rect x="42" y="290" width="86" height="6" rx="3" fill="#D3D8E0"/>
    <rect x="42" y="302" width="60" height="6" rx="3" fill="#D3D8E0"/>

    <rect x="150" y="240" width="110" height="80" rx="10" fill="#F1F3F6"/>
    <circle cx="180" cy="270" r="14" fill="#FF7A45"/>
    <text x="205" y="274" font-size="12" font-weight="600" fill="#1C1C26">PolkaGate</text>
    <rect x="162" y="290" width="86" height="6" rx="3" fill="#D3D8E0"/>
    <rect x="162" y="302" width="70" height="6" rx="3" fill="#D3D8E0"/>
  </g>

  <!-- Callouts -->
  <g>
    <circle cx="475" cy="145" r="16" fill="#E6007A"/>
    <text x="475" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  </g>
  <g>
    <circle cx="330" cy="430" r="16" fill="#E6007A"/>
    <text x="330" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  </g>
</svg>
