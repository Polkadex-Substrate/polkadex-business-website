<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" fill="none" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s4-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="s4-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6745D2"/>
      <stop offset="100%" stop-color="#E6007A"/>
    </linearGradient>
  </defs>

  <path d="M420,60 C520,80 580,220 560,340 C540,460 440,540 320,540 C200,540 100,460 120,340 C140,220 220,140 320,100 C360,84 380,52 420,60 Z" fill="url(#s4-grad)" opacity="0.85"/>
  <circle cx="480" cy="580" r="90" fill="#6745D2" opacity="0.35"/>

  <!-- Explorer window (tilted) -->
  <g transform="translate(50 130) rotate(-2)" filter="url(#s4-shadow)">
    <rect x="0" y="0" width="500" height="420" rx="16" fill="#0D0D10"/>
    <!-- Top bar -->
    <rect x="0" y="0" width="500" height="48" rx="16" fill="#1C1C26"/>
    <rect x="0" y="32" width="500" height="16" fill="#1C1C26"/>
    <circle cx="26" cy="24" r="10" fill="#E6007A"/>
    <text x="26" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">P</text>
    <text x="46" y="29" font-size="13" font-weight="600" fill="#fff">explorer.polkadex.ee</text>
    <rect x="420" y="12" width="64" height="24" rx="12" fill="#E6007A"/>
    <text x="452" y="28" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Connect</text>

    <!-- Sidebar -->
    <rect x="0" y="48" width="140" height="372" fill="#131319"/>
    <g fill="#8A94A6" font-size="12" font-weight="500">
      <rect x="16" y="70" width="108" height="30" rx="8" fill="#1C1C26"/>
      <text x="32" y="90">Dashboard</text>
      <text x="32" y="120">Explorer</text>
      <text x="32" y="150">Validators</text>
      <rect x="16" y="164" width="108" height="30" rx="8" fill="#E6007A"/>
      <text x="32" y="184" fill="#fff" font-weight="600">My Account</text>
      <text x="32" y="214">Staking Rewards</text>
      <text x="32" y="244">Governance</text>
      <text x="32" y="274">Assets</text>
      <text x="32" y="304">Blocks</text>
    </g>

    <!-- Main content: connect wallet card -->
    <text x="164" y="82" font-size="18" font-weight="700" fill="#fff">Connect a wallet</text>
    <text x="164" y="104" font-size="12" fill="#8A94A6">Pick the extension holding the account you want to stake from.</text>

    <!-- Wallet options list -->
    <g>
      <rect x="164" y="126" width="316" height="52" rx="10" fill="#1C1C26" stroke="#E6007A" stroke-width="1.5"/>
      <circle cx="188" cy="152" r="12" fill="#E6007A"/>
      <text x="188" y="156" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">P</text>
      <text x="212" y="149" font-size="13" font-weight="600" fill="#fff">Polkadot.js</text>
      <text x="212" y="165" font-size="10" fill="#8A94A6">3 accounts detected</text>
      <text x="460" y="156" text-anchor="end" font-size="11" font-weight="600" fill="#E6007A">Use</text>

      <rect x="164" y="188" width="316" height="52" rx="10" fill="#1C1C26"/>
      <circle cx="188" cy="214" r="12" fill="#6745D2"/>
      <text x="212" y="211" font-size="13" font-weight="600" fill="#fff">Talisman</text>
      <text x="212" y="227" font-size="10" fill="#8A94A6">Not detected</text>

      <rect x="164" y="250" width="316" height="52" rx="10" fill="#1C1C26"/>
      <circle cx="188" cy="276" r="12" fill="#1BC29A"/>
      <text x="212" y="273" font-size="13" font-weight="600" fill="#fff">SubWallet</text>
      <text x="212" y="289" font-size="10" fill="#8A94A6">Not detected</text>

      <rect x="164" y="312" width="316" height="52" rx="10" fill="#1C1C26"/>
      <circle cx="188" cy="338" r="12" fill="#FF7A45"/>
      <text x="212" y="335" font-size="13" font-weight="600" fill="#fff">PolkaGate</text>
      <text x="212" y="351" font-size="10" fill="#8A94A6">Not detected</text>
    </g>
  </g>

  <g>
    <circle cx="205" cy="390" r="16" fill="#E6007A"/>
    <text x="205" y="396" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  </g>
  <g>
    <circle cx="565" cy="345" r="16" fill="#E6007A"/>
    <text x="565" y="351" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  </g>
</svg>
