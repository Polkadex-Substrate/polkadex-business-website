<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" fill="none" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s5-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="s5-grad" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E6007A"/>
      <stop offset="100%" stop-color="#6745D2"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="140" r="140" fill="url(#s5-grad)" opacity="0.85"/>
  <circle cx="510" cy="540" r="110" fill="#E6007A" opacity="0.4"/>

  <!-- Validators table window -->
  <g transform="translate(60 120) rotate(3)" filter="url(#s5-shadow)">
    <rect x="0" y="0" width="490" height="440" rx="16" fill="#0D0D10"/>
    <rect x="0" y="0" width="490" height="52" rx="16" fill="#1C1C26"/>
    <rect x="0" y="36" width="490" height="16" fill="#1C1C26"/>
    <text x="24" y="32" font-size="15" font-weight="700" fill="#fff">Validators</text>
    <text x="24" y="46" font-size="10" fill="#8A94A6">Nominate up to 16</text>
    <rect x="368" y="16" width="106" height="24" rx="12" fill="#E6007A"/>
    <text x="421" y="32" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Nominate (3)</text>

    <!-- Filter row -->
    <rect x="24" y="66" width="140" height="26" rx="13" fill="#1C1C26"/>
    <text x="38" y="84" font-size="11" fill="#8A94A6">Search validators…</text>
    <rect x="172" y="66" width="88" height="26" rx="13" fill="#1C1C26"/>
    <text x="216" y="84" text-anchor="middle" font-size="11" fill="#fff">Active</text>
    <rect x="268" y="66" width="76" height="26" rx="13" fill="#1C1C26"/>
    <text x="306" y="84" text-anchor="middle" font-size="11" fill="#8A94A6">Waiting</text>

    <!-- Table header -->
    <rect x="0" y="106" width="490" height="30" fill="#131319"/>
    <text x="24" y="126" font-size="10" font-weight="700" fill="#8A94A6">VALIDATOR</text>
    <text x="220" y="126" font-size="10" font-weight="700" fill="#8A94A6">COMM.</text>
    <text x="280" y="126" font-size="10" font-weight="700" fill="#8A94A6">30D APY</text>
    <text x="356" y="126" font-size="10" font-weight="700" fill="#8A94A6">TOTAL STAKE</text>
    <text x="450" y="126" font-size="10" font-weight="700" fill="#8A94A6">PICK</text>

    <!-- Rows -->
    <g font-size="12" fill="#fff">
      <!-- row 1 -->
      <rect x="0" y="136" width="490" height="46" fill="#0D0D10"/>
      <circle cx="38" cy="159" r="10" fill="#1BC29A"/>
      <text x="56" y="156" font-weight="600">PAVAN | POLKADEX</text>
      <text x="56" y="170" font-size="9" fill="#8A94A6">esm...v7Qg</text>
      <text x="220" y="163" fill="#1BC29A" font-weight="600">3%</text>
      <text x="280" y="163" font-weight="600">14.2%</text>
      <text x="356" y="163" font-size="11">2.4M PDEX</text>
      <rect x="440" y="150" width="24" height="24" rx="6" fill="#E6007A"/>
      <path d="M446 162 l4 4 l8 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- row 2 -->
      <rect x="0" y="182" width="490" height="46" fill="#131319"/>
      <circle cx="38" cy="205" r="10" fill="#6745D2"/>
      <text x="56" y="202" font-weight="600">CRIFFERENT.DE</text>
      <text x="56" y="216" font-size="9" fill="#8A94A6">esm...9jHk</text>
      <text x="220" y="209" fill="#1BC29A" font-weight="600">4%</text>
      <text x="280" y="209" font-weight="600">13.8%</text>
      <text x="356" y="209" font-size="11">1.9M PDEX</text>
      <rect x="440" y="196" width="24" height="24" rx="6" fill="#E6007A"/>
      <path d="M446 208 l4 4 l8 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- row 3 -->
      <rect x="0" y="228" width="490" height="46" fill="#0D0D10"/>
      <circle cx="38" cy="251" r="10" fill="#FF7A45"/>
      <text x="56" y="248" font-weight="600">HODL</text>
      <text x="56" y="262" font-size="9" fill="#8A94A6">esm...4mQz</text>
      <text x="220" y="255" fill="#1BC29A" font-weight="600">5%</text>
      <text x="280" y="255" font-weight="600">13.1%</text>
      <text x="356" y="255" font-size="11">1.4M PDEX</text>
      <rect x="440" y="242" width="24" height="24" rx="6" fill="#E6007A"/>
      <path d="M446 254 l4 4 l8 -8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- row 4 -->
      <rect x="0" y="274" width="490" height="46" fill="#131319"/>
      <circle cx="38" cy="297" r="10" fill="#148FE8"/>
      <text x="56" y="294" font-weight="600">PATHROCKNETWORK</text>
      <text x="56" y="308" font-size="9" fill="#8A94A6">esm...c2Bz</text>
      <text x="220" y="301" font-weight="600" fill="#fff">12%</text>
      <text x="280" y="301" font-weight="600">10.4%</text>
      <text x="356" y="301" font-size="11">980K PDEX</text>
      <rect x="440" y="288" width="24" height="24" rx="6" fill="#1C1C26" stroke="#2A2A38"/>

      <!-- row 5 flagged high risk -->
      <rect x="0" y="320" width="490" height="46" fill="#0D0D10"/>
      <circle cx="38" cy="343" r="10" fill="#8A94A6"/>
      <text x="56" y="340" font-weight="600">SLOW.NODE</text>
      <text x="56" y="354" font-size="9" fill="#FF6B6B">HIGH RISK · Commission 62%</text>
      <text x="220" y="347" font-weight="600" fill="#FF6B6B">62%</text>
      <text x="280" y="347" font-weight="600">4.2%</text>
      <text x="356" y="347" font-size="11">220K PDEX</text>
      <rect x="440" y="334" width="24" height="24" rx="6" fill="#1C1C26" stroke="#2A2A38"/>
    </g>

    <!-- Footer -->
    <text x="24" y="402" font-size="11" fill="#8A94A6">3 of 16 nominated · Avoid HIGH RISK entries</text>
  </g>

  <g>
    <circle cx="280" cy="220" r="16" fill="#E6007A"/>
    <text x="280" y="226" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  </g>
  <g>
    <circle cx="345" cy="285" r="16" fill="#E6007A"/>
    <text x="345" y="291" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  </g>
  <g>
    <circle cx="510" cy="270" r="16" fill="#E6007A"/>
    <text x="510" y="276" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">3</text>
  </g>
</svg>
