<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" fill="none" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s2-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="s2-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6745D2"/>
      <stop offset="100%" stop-color="#E6007A"/>
    </linearGradient>
  </defs>

  <path d="M60,120 C160,60 320,80 440,140 C560,200 560,360 500,460 C440,560 260,600 160,540 C60,480 40,360 30,280 C20,200 0,150 60,120 Z" fill="url(#s2-grad)" opacity="0.85"/>
  <circle cx="500" cy="580" r="80" fill="#E6007A" opacity="0.35"/>

  <!-- Wallet popup mockup -->
  <g transform="translate(120 120) rotate(4)" filter="url(#s2-shadow)">
    <rect x="0" y="0" width="360" height="440" rx="20" fill="#1C1C26"/>
    <!-- Header -->
    <rect x="0" y="0" width="360" height="60" rx="20" fill="#2A2A38"/>
    <rect x="0" y="40" width="360" height="20" fill="#2A2A38"/>
    <circle cx="30" cy="30" r="14" fill="#E6007A"/>
    <text x="30" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">P</text>
    <text x="54" y="35" font-size="14" font-weight="600" fill="#fff">Create Account</text>
    <text x="330" y="35" text-anchor="middle" font-size="18" fill="#8A94A6">×</text>

    <!-- Warning banner -->
    <rect x="24" y="84" width="312" height="66" rx="10" fill="#3A2418"/>
    <rect x="24" y="84" width="4" height="66" fill="#FFA500"/>
    <text x="42" y="106" font-size="12" font-weight="600" fill="#FFA500">Write down your seed phrase</text>
    <text x="42" y="124" font-size="11" fill="#B8BCC8">Store it offline — anyone with it</text>
    <text x="42" y="138" font-size="11" fill="#B8BCC8">controls your account.</text>

    <!-- Seed phrase grid -->
    <text x="24" y="180" font-size="12" font-weight="600" fill="#8A94A6">RECOVERY PHRASE</text>
    <g font-size="11" font-weight="600" fill="#fff">
      <rect x="24" y="192" width="100" height="30" rx="6" fill="#2A2A38"/>
      <text x="34" y="211">1. galaxy</text>
      <rect x="130" y="192" width="100" height="30" rx="6" fill="#2A2A38"/>
      <text x="140" y="211">2. river</text>
      <rect x="236" y="192" width="100" height="30" rx="6" fill="#2A2A38"/>
      <text x="246" y="211">3. autumn</text>

      <rect x="24" y="228" width="100" height="30" rx="6" fill="#2A2A38"/>
      <text x="34" y="247">4. mirror</text>
      <rect x="130" y="228" width="100" height="30" rx="6" fill="#2A2A38"/>
      <text x="140" y="247">5. cobalt</text>
      <rect x="236" y="228" width="100" height="30" rx="6" fill="#2A2A38"/>
      <text x="246" y="247">6. quartz</text>

      <rect x="24" y="264" width="100" height="30" rx="6" fill="#2A2A38"/>
      <text x="34" y="283">7. velvet</text>
      <rect x="130" y="264" width="100" height="30" rx="6" fill="#2A2A38"/>
      <text x="140" y="283">8. beacon</text>
      <rect x="236" y="264" width="100" height="30" rx="6" fill="#2A2A38"/>
      <text x="246" y="283">9. glacier</text>
    </g>

    <!-- Confirm checkbox -->
    <rect x="24" y="316" width="18" height="18" rx="4" fill="none" stroke="#4B4E5A" stroke-width="2"/>
    <path d="M28 325 l4 4 l6 -8" stroke="#E6007A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="52" y="330" font-size="11" fill="#B8BCC8">I have saved my recovery phrase</text>

    <!-- CTA -->
    <rect x="24" y="360" width="312" height="46" rx="10" fill="#E6007A"/>
    <text x="180" y="388" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Next</text>
  </g>

  <g>
    <circle cx="180" cy="230" r="16" fill="#E6007A"/>
    <text x="180" y="236" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
  </g>
  <g>
    <circle cx="475" cy="430" r="16" fill="#E6007A"/>
    <text x="475" y="436" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">2</text>
  </g>
</svg>
