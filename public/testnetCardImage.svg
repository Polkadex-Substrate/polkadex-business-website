<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" font-family="'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D0D10"/>
      <stop offset="100%" stop-color="#1C1C26"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6007A"/>
      <stop offset="100%" stop-color="#6745D2"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#E6007A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#E6007A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.9" cy="0.85" r="0.55">
      <stop offset="0%" stop-color="#6745D2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6745D2" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#blob1)"/>
  <rect width="1200" height="630" fill="url(#blob2)"/>

  <!-- Brand row (top) -->
  <g transform="translate(80 74)">
    <!-- Polkadex icon mark -->
    <g transform="translate(0 -6)">
      <rect x="0" y="0" width="52" height="52" rx="14" fill="#1C1C26" stroke="#2A2A38"/>
      <path d="M43 42 v-7 L36 27 h-6 Z" fill="#fff"/>
      <path d="M9 15 v7 l7 8 h6 Z" fill="#fff"/>
      <path d="M13 9 h7 l6 6 6-6 h7 L26 20 Z" fill="#fff"/>
      <path d="M13 47 h7 l6-6 6 6 h7 L26 36 Z" fill="#fff"/>
      <circle cx="26" cy="27" r="3" fill="#E6007A"/>
    </g>
    <text x="70" y="30" font-size="26" font-weight="700" fill="#fff">Polkadex</text>
    <text x="70" y="54" font-size="14" font-weight="500" fill="#8A94A6" letter-spacing="2">POLKADEX 2.0</text>
  </g>

  <!-- Live pill -->
  <g transform="translate(1020 82)" filter="url(#softShadow)">
    <rect x="0" y="0" width="102" height="36" rx="18" fill="#E6007A"/>
    <circle cx="20" cy="18" r="5" fill="#fff"/>
    <circle cx="20" cy="18" r="9" fill="#fff" opacity="0.25">
      <animate attributeName="r" values="6;12;6" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0;0.35" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="24" font-size="15" font-weight="700" fill="#fff" letter-spacing="1.5">LIVE</text>
  </g>

  <!-- Headline -->
  <text x="80" y="260" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-2">Orderbook Testnet</text>
  <text x="80" y="348" font-size="72" font-weight="800" fill="#E6007A" letter-spacing="-2">is Live.</text>

  <!-- Dates subline -->
  <text x="80" y="408" font-size="27" font-weight="500" fill="#A8ADB7">70 days to test — closes Sep 30 · Mainnet: November 2026</text>

  <!-- Feature strip -->
  <g transform="translate(80 460)">
    <g>
      <circle cx="12" cy="12" r="10" fill="none" stroke="#E6007A" stroke-width="2"/>
      <path d="M7 12 l4 4 l7 -8" fill="none" stroke="#E6007A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="18" font-size="24" font-weight="600" fill="#fff">Non-custodial</text>
    </g>
    <g transform="translate(340 0)">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#E6007A" stroke-width="2"/>
      <path d="M7 12 l4 4 l7 -8" fill="none" stroke="#E6007A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="32" y="18" font-size="24" font-weight="600" fill="#fff">Cross-chain via Hyperbridge</text>
    </g>
  </g>

  <!-- URL -->
  <g transform="translate(80 550)">
    <text font-size="22" font-weight="500" fill="#8A94A6">polkadex.ee</text>
  </g>

  <!-- Brand accent gradient bar -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#brand)"/>
</svg>
